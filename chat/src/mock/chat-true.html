<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trader chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── header ───────────────────────────────────────────────────── */
        #header {
            padding: 12px 20px;
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            font-size: 13px;
            color: #999;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }

        #header span {
            color: #16a34a;
            font-weight: 600;
        }

        /* ── main layout ──────────────────────────────────────────────── */
        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── center panel ─────────────────────────────────────────────── */
        #center {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e5e5e5;
            background: #fff;
            overflow: hidden;
        }

        #tabs {
            display: flex;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
        }

        .tab {
            padding: 10px 20px;
            font-size: 12px;
            color: #999;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s;
            user-select: none;
        }

        .tab:hover {
            color: #1a1a1a;
        }

        .tab.active {
            color: #1d4ed8;
            border-bottom-color: #1d4ed8;
            font-weight: 500;
        }

        .tab-panel {
            display: none;
            flex: 1;
            overflow: auto;
            padding: 16px;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
        }

        .tab-panel::-webkit-scrollbar {
            width: 4px;
        }

        .tab-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .tab-panel::-webkit-scrollbar-thumb {
            background: #e5e5e5;
            border-radius: 2px;
        }

        /* ── data panel ───────────────────────────────────────────────── */
        #data-updated {
            font-size: 10px;
            color: #bbb;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .status-badge.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .status-badge.pending {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .status-badge.empty {
            background: #f5f5f5;
            color: #999;
            border: 1px solid #e5e5e5;
        }

        .data-title {
            font-size: 12px;
            font-weight: 600;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #e5e5e5;
        }

        .order-card {
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px 16px;
            font-size: 12px;
        }

        .order-card .field {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .order-card .label {
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .order-card .value {
            font-weight: 500;
            color: #1a1a1a;
        }

        .order-card .value.side-B {
            color: #16a34a;
        }

        .order-card .value.side-S {
            color: #dc2626;
        }

        /* ── audit panel ──────────────────────────────────────────────── */
        #audit-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .audit-card {
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
            font-size: 11px;
        }

        .audit-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            font-size: 11px;
            color: #999;
        }

        .audit-card-header .msg-preview {
            color: #1a1a1a;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .audit-state {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 11px;
        }

        .audit-state .state-val {
            background: #f0f0f0;
            border-radius: 4px;
            padding: 1px 6px;
            color: #555;
            font-size: 10px;
        }

        .audit-state .state-val.changed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .audit-state .arrow {
            color: #bbb;
            font-size: 10px;
        }

        .audit-section {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .audit-section:last-child {
            border-bottom: none;
        }

        .audit-section-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #bbb;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .audit-cmd-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .audit-cmd-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 4px;
            padding: 2px 7px;
            color: #1d4ed8;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 10px;
        }

        .audit-cmd-tag strong {
            color: #1d4ed8;
        }

        .audit-cmd-tag .cmd-params {
            color: #1e40af;
        }

        .audit-result-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .audit-result-item {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-left: 3px solid #16a34a;
            border-radius: 4px;
            padding: 5px 8px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 10px;
            color: #555;
            line-height: 1.5;
            word-break: break-all;
        }

        .audit-result-item.has-instruction {
            border-left-color: #f59e0b;
        }

        .audit-result-item.has-interrupt {
            border-left-color: #ef4444;
        }

        .audit-result-type {
            color: #16a34a;
            font-weight: 600;
            margin-right: 6px;
        }

        .audit-result-type.instruction {
            color: #f59e0b;
        }

        .audit-result-type.interrupt {
            color: #ef4444;
        }

        .json-fallback {
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-left: 3px solid #1d4ed8;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 11px;
            line-height: 1.5;
            color: #555;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
        }

        /* ── chat panel ───────────────────────────────────────────────── */
        #chat {
            width: 40%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #messages::-webkit-scrollbar {
            width: 4px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-row.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-row.agent {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 8px 13px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user .bubble {
            background: #1d4ed8;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .agent .bubble {
            background: #fff;
            color: #1a1a1a;
            border: 1px solid #e5e5e5;
            border-bottom-left-radius: 4px;
        }

        .meta {
            font-size: 10px;
            color: #bbb;
            margin-top: 3px;
            padding: 0 4px;
        }

        .typing .bubble {
            color: #bbb;
            font-style: italic;
            font-size: 12px;
        }

        #footer {
            padding: 10px 12px;
            background: #fff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            background: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 9px 13px;
            font-size: 13px;
            color: #1a1a1a;
            resize: none;
            outline: none;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.5;
            font-family: inherit;
        }

        #input:focus {
            border-color: #1d4ed8;
        }

        #input::placeholder {
            color: #bbb;
        }

        #btn {
            background: #1d4ed8;
            border: none;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        #btn:hover {
            background: #2563eb;
        }

        #btn:disabled {
            background: #c7d7f5;
            cursor: default;
        }

        #btn svg {
            width: 15px;
            height: 15px;
            fill: #fff;
        }

        /* ── conversas (auditoria) ────────────────────────────────────── */
        .cv-hd { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
        .cv-hd h3 { font-size:12px; font-weight:600; color:#1a1a1a; text-transform:uppercase; letter-spacing:.04em; }
        .cv-hd p { font-size:11px; color:#999; }
        .cv-search { width:100%; padding:8px 11px; border:1px solid #e5e5e5; border-radius:8px; font-size:12px; color:#1a1a1a; margin-bottom:10px; outline:none; font-family:inherit; }
        .cv-search:focus { border-color:#1d4ed8; }
        .cv-search::placeholder { color:#bbb; }
        .cv-list { display:flex; flex-direction:column; gap:6px; }
        .cv-row { background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:9px 11px; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit; display:grid; grid-template-columns:1fr auto; gap:5px 10px; transition:border-color .12s; }
        .cv-row:hover { border-color:#1d4ed8; background:#fafbff; }
        .cv-id { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:11px; color:#1a1a1a; word-break:break-all; }
        .cv-acct { color:#999; }
        .cv-last { font-size:11px; color:#666; grid-column:1/-1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .cv-badges { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
        .cv-badge { font-size:10px; font-family:'SF Mono','Cascadia Code','Consolas',monospace; padding:1px 6px; border-radius:5px; background:#f5f5f5; color:#666; border:1px solid #e5e5e5; white-space:nowrap; }
        .cv-badge.nf { color:#b45309; background:#fffbeb; border-color:#fde68a; }
        .cv-badge.ord { color:#16a34a; background:#f0fdf4; border-color:#bbf7d0; }
        .cv-back { background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:6px 12px; font:inherit; font-size:12px; color:#666; cursor:pointer; margin-bottom:12px; }
        .cv-back:hover { border-color:#1d4ed8; color:#1a1a1a; }
        .cv-meta { background:#f9f9f9; border:1px solid #e5e5e5; border-radius:8px; padding:11px 13px; margin-bottom:14px; }
        .cv-mid { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:11px; color:#1a1a1a; word-break:break-all; }
        .cv-facts { display:flex; gap:14px; flex-wrap:wrap; margin-top:9px; }
        .cv-fact { font-size:10px; color:#999; text-transform:uppercase; letter-spacing:.03em; }
        .cv-fact b { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:14px; color:#1a1a1a; display:block; text-transform:none; letter-spacing:0; font-weight:600; }
        .turn { border:1px solid #e5e5e5; border-radius:10px; padding:10px 12px; margin-bottom:8px; background:#fff; }
        .turn.nf { border-color:#fde68a; }
        .turn.err { border-color:#fecaca; }
        .turn-hd { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:10px; color:#bbb; display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:7px; }
        .turn-hd .seq { color:#666; font-weight:600; }
        .flag { font-size:9px; font-family:'SF Mono','Cascadia Code','Consolas',monospace; padding:1px 5px; border-radius:4px; text-transform:uppercase; letter-spacing:.02em; }
        .flag.nf { background:#fffbeb; color:#b45309; }
        .flag.err { background:#fef2f2; color:#ef4444; }
        .flag.int { background:#eff6ff; color:#1d4ed8; }
        .cv-bubble { padding:7px 11px; border-radius:12px; font-size:12.5px; line-height:1.45; margin-bottom:5px; word-break:break-word; }
        .cv-bubble.user { background:#eff3ff; border:1px solid #dbe4ff; }
        .cv-bubble.agent { background:#fff; border:1px solid #e5e5e5; }
        .cv-bubble .who { font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:#bbb; display:block; margin-bottom:2px; }
        .turn-tech { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; padding-top:7px; border-top:1px dashed #eee; }
        .tech { font-size:10px; font-family:'SF Mono','Cascadia Code','Consolas',monospace; padding:1px 6px; border-radius:5px; background:#f9f9f9; border:1px solid #eee; color:#666; }
        .tech.cmd { color:#16a34a; }
        .tech.cmd.miss { color:#b45309; }
        .tech.llm { color:#999; }
        .tech .st { color:#bbb; }
        .cv-orders h4 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#1a1a1a; margin:14px 0 8px; padding-bottom:5px; border-bottom:1px solid #e5e5e5; }
        .ord-row { display:grid; grid-template-columns:auto auto 1fr auto; gap:9px; align-items:center; background:#f9f9f9; border:1px solid #e5e5e5; border-radius:8px; padding:7px 10px; margin-bottom:5px; font-size:11.5px; }
        .ord-type { font-size:9px; font-family:'SF Mono','Cascadia Code','Consolas',monospace; padding:1px 6px; border-radius:4px; white-space:nowrap; }
        .ord-type.sent { background:#f0fdf4; color:#16a34a; }
        .ord-type.cancel { background:#fef2f2; color:#ef4444; }
        .ord-sym { font-family:'SF Mono','Cascadia Code','Consolas',monospace; color:#1a1a1a; font-weight:600; }
        .ord-det { color:#666; font-family:'SF Mono','Cascadia Code','Consolas',monospace; }
        .ord-reason { color:#ef4444; }
        .ord-when { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:10px; color:#bbb; }
        .cv-loading, .cv-error { padding:24px; text-align:center; color:#999; font-size:12px; }
        .cv-error { color:#ef4444; }

        /* ── métricas (KPIs) ──────────────────────────────────────────── */
        .mx-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
        .mx-periods { display:flex; gap:2px; background:#f5f5f5; border:1px solid #e5e5e5; border-radius:8px; padding:2px; }
        .mx-period { border:0; background:transparent; font:inherit; font-size:11px; color:#999; padding:5px 11px; border-radius:6px; cursor:pointer; }
        .mx-period:hover { color:#1a1a1a; }
        .mx-period.active { background:#fff; color:#1d4ed8; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06); }
        .mx-note { font-size:10px; color:#bbb; }
        .mx-exec { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .mx-kpi { background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:12px; }
        .mx-kpi .lbl { font-size:10px; color:#999; text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:4px; }
        .mx-kpi .val { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:23px; font-weight:600; color:#1a1a1a; margin-top:5px; letter-spacing:-.02em; line-height:1; }
        .mx-kpi .val .u { font-size:13px; color:#bbb; margin-left:1px; }
        .mx-kpi .q { font-size:10px; color:#bbb; margin-top:6px; line-height:1.3; }
        .mx-dir { font-size:9px; }
        .mx-dir.up { color:#16a34a; } .mx-dir.down { color:#bbb; }
        .mx-sec { margin-top:20px; }
        .mx-sec-h { border-bottom:1px solid #e5e5e5; padding-bottom:7px; margin-bottom:11px; }
        .mx-sec-h h4 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#1a1a1a; }
        .mx-sec-h p { font-size:11px; color:#999; margin-top:2px; }
        .mx-mini { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:8px; margin-bottom:11px; }
        .mx-m { background:#fff; border:1px solid #e5e5e5; border-radius:9px; padding:10px 11px; }
        .mx-m .v { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:18px; font-weight:600; color:#1a1a1a; }
        .mx-m .l { font-size:10px; color:#999; margin-top:2px; }
        .mx-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; align-items:start; }
        .mx-card { background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:13px; }
        .mx-card.wide { grid-column:1/-1; }
        .mx-card h5 { font-size:12px; color:#1a1a1a; font-weight:600; }
        .mx-card .cq { font-size:10px; color:#bbb; margin:2px 0 12px; line-height:1.3; }
        .mx-bar { display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:8px; margin-bottom:6px; }
        .mx-bl { font-size:11px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mx-bt { background:#f5f5f5; border-radius:5px; height:8px; overflow:hidden; border:1px solid #eee; }
        .mx-bf { height:100%; border-radius:5px; }
        .mx-bv { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:11px; color:#1a1a1a; font-weight:600; white-space:nowrap; }
        .mx-bsub { color:#bbb; font-weight:400; font-size:10px; }
        .mx-donut-wrap { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
        .mx-donut { width:110px; height:110px; flex:0 0 auto; }
        .mx-donut-c { font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:19px; font-weight:600; fill:#1a1a1a; text-anchor:middle; }
        .mx-donut-cl { font-size:7px; fill:#bbb; text-anchor:middle; text-transform:uppercase; letter-spacing:.1em; }
        .mx-legend { display:flex; flex-direction:column; gap:6px; flex:1; min-width:110px; }
        .mx-lg { font-size:11px; color:#666; display:flex; align-items:center; gap:6px; } .mx-lg b { color:#1a1a1a; font-family:'SF Mono','Cascadia Code','Consolas',monospace; }
        .mx-sw { width:9px; height:9px; border-radius:3px; flex:0 0 auto; }
        .mx-tbl { width:100%; border-collapse:collapse; font-size:11.5px; }
        .mx-tbl th { text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:#bbb; font-weight:600; padding:5px 8px; border-bottom:1px solid #e5e5e5; white-space:nowrap; }
        .mx-tbl td { padding:5px 8px; border-bottom:1px solid #f0f0f0; color:#666; } .mx-tbl td.n { font-family:'SF Mono','Cascadia Code','Consolas',monospace; color:#1a1a1a; text-align:right; }
        .mx-ts { display:flex; align-items:flex-end; gap:3px; height:80px; padding-top:6px; }
        .mx-ts-bar { flex:1; min-width:5px; max-width:36px; display:flex; flex-direction:column-reverse; border-radius:3px 3px 0 0; overflow:hidden; background:#f5f5f5; }
        .mx-ts-seg { width:100%; }
        .mx-ts-x { display:flex; gap:3px; margin-top:5px; }
        .mx-ts-xl { flex:1; min-width:5px; max-width:36px; font-family:'SF Mono','Cascadia Code','Consolas',monospace; font-size:8px; color:#bbb; text-align:center; }
        .mx-ts-legend { display:flex; gap:12px; margin-top:9px; font-size:11px; color:#666; }
        .mx-ts-legend b { font-family:'SF Mono','Cascadia Code','Consolas',monospace; color:#1a1a1a; }
        .mx-empty { color:#bbb; font-size:11px; }
    </style>
</head>

<body>

    <div id="header">trader <span>chat</span></div>

    <div id="main">

        <div id="center">
            <div id="tabs">
                <div class="tab active" onclick="selectTab('data')">Data</div>
                <div class="tab" onclick="selectTab('audit')">Audit</div>
                <div class="tab" onclick="selectTab('conversas')">Conversas</div>
                <div class="tab" onclick="selectTab('metricas')">Metricas</div>
            </div>
            <div id="panel-data" class="tab-panel active">
                <div id="data-updated"></div>
                <div id="data-content"></div>
            </div>
            <div id="panel-audit" class="tab-panel">
                <div id="audit-content"></div>
            </div>
            <div id="panel-conversas" class="tab-panel">
                <div id="conversas-content"></div>
            </div>
            <div id="panel-metricas" class="tab-panel">
                <div id="metrics-content"></div>
            </div>
        </div>

        <div id="chat">
            <div id="messages"></div>
            <div id="footer">
                <textarea id="input" rows="1" placeholder="mensagem..."></textarea>
                <button id="btn" onclick="send()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>

        // ── context ───────────────────────────────────────────────────────
        const contextId = window.location.hash.slice(1) || undefined

        const ctxHeaders = (extra = {}) => {
            const headers = { ...extra }
            if (contextId) headers['context-id'] = contextId
            return headers
        }

        let cmdHistory = []
        let historyIdx = -1

        const messages = document.getElementById('messages')
        const input = document.getElementById('input')
        const btn = document.getElementById('btn')
        const dataContent = document.getElementById('data-content')
        const dataUpdated = document.getElementById('data-updated')
        const auditContent = document.getElementById('audit-content')

        // ── utils ─────────────────────────────────────────────────────────
        const now = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })

        function escHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
        }

        function scrollBottom() { messages.scrollTop = messages.scrollHeight }

        // ── fetch ─────────────────────────────────────────────────────────
        // 'not-found' é um estado ESPERADO (contexto novo, sem dados/histórico),
        // não um erro. Centraliza a detecção para /data e /history.
        const NOT_FOUND = Symbol('not-found')

        async function fetchJson(url) {
            const res = await fetch(url, { headers: ctxHeaders() })

            // 404 -> contexto ainda sem dados/histórico
            if (res.status === 404) return NOT_FOUND
            if (!res.ok) throw new Error(`${url} -> ${res.status}`)

            const body = await res.json()
            // ou sinalizado no corpo: "not-found" / { status:'not-found' }
            if (body === 'not-found' || body?.status === 'not-found') return NOT_FOUND
            return body
        }

        // ── tabs ──────────────────────────────────────────────────────────
        function selectTab(name) {
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.textContent.toLowerCase() === name)
            })
            document.querySelectorAll('.tab-panel').forEach(p => {
                p.classList.toggle('active', p.id === `panel-${name}`)
            })
            if (name === 'conversas') loadConversas()
            if (name === 'metricas') loadMetrics()
        }

        // ── input ─────────────────────────────────────────────────────────
        input.addEventListener('input', () => {
            input.style.height = 'auto'
            input.style.height = Math.min(input.scrollHeight, 100) + 'px'
        })

        input.addEventListener('keydown', async e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault()
                send()
                return
            }

            if (e.key === 'ArrowUp') {
                e.preventDefault()
                if (input.value.trim()) return
                await ensureHistory()
                if (!cmdHistory.length) return
                historyIdx = Math.min(historyIdx + 1, cmdHistory.length - 1)
                input.value = cmdHistory[historyIdx]
                input.style.height = 'auto'
                input.style.height = Math.min(input.scrollHeight, 100) + 'px'
                requestAnimationFrame(() => {
                    input.selectionStart = input.selectionEnd = input.value.length
                })
                return
            }

            if (e.key === 'ArrowDown') {
                e.preventDefault()
                if (input.value.trim()) return
                if (historyIdx <= 0) {
                    historyIdx = -1
                    input.value = ''
                    input.style.height = 'auto'
                    return
                }
                historyIdx--
                input.value = cmdHistory[historyIdx]
                input.style.height = 'auto'
                input.style.height = Math.min(input.scrollHeight, 100) + 'px'
                return
            }

            historyIdx = -1
        })

        // ── chat ──────────────────────────────────────────────────────────
        function appendMessage(text, role, rtt) {
            const row = document.createElement('div')
            row.className = `msg-row ${role}`

            const bubble = document.createElement('div')
            bubble.className = 'bubble'
            bubble.innerHTML = escHtml(text).replace(/\n/g, '<br>')   // escapa + quebra de linha

            const meta = document.createElement('div')
            meta.className = 'meta'
            meta.textContent = rtt !== undefined ? `${now()}  ·  ${rtt} ms` : now()

            row.appendChild(bubble)
            row.appendChild(meta)
            messages.appendChild(row)
            scrollBottom()
            return row
        }

        function appendTyping() {
            const row = document.createElement('div')
            row.className = 'msg-row agent typing'
            const bubble = document.createElement('div')
            bubble.className = 'bubble'
            bubble.textContent = 'digitando...'
            row.appendChild(bubble)
            messages.appendChild(row)
            scrollBottom()
            return row
        }

        // ── data ──────────────────────────────────────────────────────────

        function resolveOutput(type) {
            switch (type) {
                case 'order_card':
                    return { title: 'Boleta em Preenchimento', empty: 'nenhuma boleta em preenchimento', render: renderOrderCard }
                case 'order_card@modify':
                    return { title: 'Boleta de Modificação', empty: 'nenhuma boleta em preenchimento', render: renderOrderCard }
                case 'order_card@cancel':
                    return { title: 'Boleta de Cancelamento', empty: 'nenhuma boleta em preenchimento', render: renderOrderCard }
                case 'basket_card':
                    return { title: 'Cesta de Boletas', empty: 'nenhuma boleta na cesta', render: renderOrderCard }
                case 'open_order_card':
                case 'open_order_card@modify':
                case 'open_order_card@cancel':
                    return { title: 'Ordens Abertas', empty: 'nenhuma ordem aberta', render: renderOpenOrderCard }
                default:
                    return null
            }
        }

        // ── formatters ──
        const DASH = '—'
        const fmtInt = v => v == null ? DASH : Number(v).toLocaleString('pt-BR')
        const fmtMoney = v => v == null ? DASH : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        const fmtVolume = v => v == null ? DASH : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        const fmtSide = v => ({ B: 'Compra', S: 'Venda' }[v] ?? v ?? DASH)
        const fmtPrice = v => ({ L: 'Limitado', M: 'Mercado' }[v] ?? v ?? DASH)
        const fmtRequestType = v => ({ C: 'Criação', M: 'Modificação', X: 'Cancelamento' }[v] ?? v ?? DASH)
        const fmtDate = v => { const d = new Date(v); return isNaN(d) ? (v ?? DASH) : d.toLocaleDateString('pt-BR') }
        const fmtDateTime = v => { const d = new Date(v); return isNaN(d) ? (v ?? DASH) : d.toLocaleString('pt-BR') }

        const ORDER_FIELDS = [
            { key: 'requestType', label: 'Operação', fmt: fmtRequestType },
            { key: 'orderId', label: 'Ordem' },
            { key: 'account', label: 'Conta' },
            { key: 'symbol', label: 'Ativo' },
            { key: 'side', label: 'Lado', fmt: fmtSide, cls: v => `side-${v}` },
            { key: 'quantity', label: 'Qtd', fmt: fmtInt },
            { key: 'volume', label: 'Vol. Financeiro', fmt: fmtVolume },
            { key: 'quantityMin', label: 'Qtd Mín', fmt: fmtInt },
            { key: 'quantityDisplay', label: 'Qtd Aparente', fmt: fmtInt },
            { key: 'priceType', label: 'Tipo Preço', fmt: fmtPrice },
            { key: 'price', label: 'Preço Limite', fmt: fmtMoney },
            { key: 'trigger', label: 'Preço Gatilho', fmt: fmtMoney },
            { key: 'expireType', label: 'Validade' },
            { key: 'expireDate', label: 'Vencimento', fmt: fmtDate }
        ]

        const OPEN_ORDER_FIELDS = [
            { key: 'orderId', label: 'Ordem' },
            { key: 'account', label: 'Conta' },
            { key: 'symbol', label: 'Ativo' },
            { key: 'side', label: 'Lado', fmt: fmtSide, cls: v => `side-${v}` },
            { key: 'quantity', label: 'Qtd', fmt: fmtInt },
            { key: 'quantityMin', label: 'Qtd Mín', fmt: fmtInt },
            { key: 'quantityDisplay', label: 'Qtd Aparente', fmt: fmtInt },
            { key: 'priceType', label: 'Tipo Preço', fmt: fmtPrice },
            { key: 'price', label: 'Preço Limite', fmt: fmtMoney },
            { key: 'trigger', label: 'Preço Gatilho', fmt: fmtMoney },
            { key: 'expireType', label: 'Validade' },
            { key: 'expireTime', label: 'Expira em', fmt: fmtDate },
            { key: 'creationTime', label: 'Criada em', fmt: fmtDateTime },
            { key: 'orderStatus', label: 'Status' },
            { key: 'requestType', label: 'Tipo Req' },
            { key: 'requestStatus', label: 'Status Req' },
            { key: 'pendingQuantity', label: 'Qtd Pendente', fmt: fmtInt },
            { key: 'filledQuantity', label: 'Qtd Executada', fmt: fmtInt },
            { key: 'filledAveragePrice', label: 'Preço Médio', fmt: fmtMoney },
            { key: 'filledVolume', label: 'Volume Exec', fmt: fmtMoney },
            { key: 'pendingVolume', label: 'Volume Pend', fmt: fmtMoney }
        ]

        async function refreshData() {
            try {
                const json = await fetchJson('/api/trader-chat/data')
                if (json === NOT_FOUND) return renderEmptyData()   // estado esperado
                renderData(json)
            } catch (e) { console.warn('refreshData', e) }
        }

        function renderEmptyData() {
            dataUpdated.textContent = `atualizado em ${now()}`
            dataContent.innerHTML = ''
            const empty = document.createElement('div')
            empty.style.cssText = 'font-size:12px;color:#bbb;margin-top:8px'
            empty.textContent = 'nenhum dado disponível ainda'
            dataContent.appendChild(empty)
        }

        function renderData(json) {
            dataUpdated.textContent = `atualizado em ${now()}`
            dataContent.innerHTML = ''

            // badge de status
            const badge = document.createElement('div')
            badge.className = `status-badge ${json.output_status || 'empty'}`
            badge.textContent = json.message || json.output_status || ''
            dataContent.appendChild(badge)

            const type = json.output_type
            const raw = json.output
            // order_card (e variantes) vêm como objeto único; basket/open vêm como array
            const items = Array.isArray(raw) ? raw : (raw ? [raw] : [])

            const spec = resolveOutput(type)   // fonte única: label + empty + render

            // título (label)
            if (type) {
                const title = document.createElement('div')
                title.className = 'data-title'
                title.textContent = spec?.title || type
                dataContent.appendChild(title)
            }

            // tipo não coberto
            if (!spec) {
                if (!items.length) {
                    const notice = document.createElement('div')
                    notice.style.cssText = 'font-size:12px;color:#bbb;margin-top:8px'
                    notice.textContent = type
                        ? `visualização de "${type}" ainda não disponível`
                        : 'nenhum dado para exibir'
                    dataContent.appendChild(notice)
                    return
                }

                for (const item of items) {
                    const pre = document.createElement('pre')
                    pre.className = 'json-fallback'
                    pre.textContent = JSON.stringify(item, null, 2)   // textContent já escapa
                    dataContent.appendChild(pre)
                }
                return
            }

            // coberto, porém sem itens
            if (!items.length) {
                const empty = document.createElement('div')
                empty.style.cssText = 'font-size:12px;color:#bbb;margin-top:8px'
                empty.textContent = spec.empty
                dataContent.appendChild(empty)
                return
            }

            // render
            for (const item of items) {
                dataContent.appendChild(spec.render(item))
            }
        }

        function renderCardFields(item, fields) {
            const card = document.createElement('div')
            card.className = 'order-card'

            for (const f of fields) {
                const raw = item[f.key]
                if (raw == null || raw === '') continue   // omite vazios; preserva 0

                const val = f.fmt ? f.fmt(raw) : raw
                const cls = f.cls ? ` ${f.cls(raw)}` : ''

                const field = document.createElement('div')
                field.className = 'field'
                field.innerHTML =
                    `<span class="label">${escHtml(f.label)}</span>` +
                    `<span class="value${cls}">${escHtml(val)}</span>`
                card.appendChild(field)
            }

            return card
        }

        function renderOrderCard(item) {
            return renderCardFields(item, ORDER_FIELDS)
        }

        function renderOpenOrderCard(item) {
            return renderCardFields(item, OPEN_ORDER_FIELDS)
        }

        // ── audit ─────────────────────────────────────────────────────────
        async function refreshAudit() {
            try {
                const msgs = await fetchJson('/api/trader-chat/history?role=user&count=1&audit=true')
                if (msgs === NOT_FOUND || !msgs?.length) return   // esperado: ainda sem histórico

                const msg = msgs[0]
                renderAuditCard(msg)

                if (msg.content && cmdHistory[0] !== msg.content) {
                    cmdHistory.unshift(msg.content)
                }
            } catch (e) { console.warn('refreshAudit', e) }
        }

        async function ensureHistory() {
            if (cmdHistory.length) return
            try {
                const msgs = await fetchJson('/api/trader-chat/history?role=user')
                if (msgs === NOT_FOUND) return            // esperado: sem histórico
                cmdHistory = msgs.map(m => m.content).reverse()
            } catch (e) { console.warn('ensureHistory', e) }
        }

        function renderAuditCard(msg) {
            const card = document.createElement('div')
            card.className = 'audit-card'

            // header
            const header = document.createElement('div')
            header.className = 'audit-card-header'
            header.innerHTML = `<span class="msg-preview">${escHtml(msg.content)}</span><span>${now()}</span>`
            card.appendChild(header)

            // state transition
            const stateChanged = msg.state !== msg.stateNext
            const stateRow = document.createElement('div')
            stateRow.className = 'audit-state'
            stateRow.innerHTML = `
            <span>estado</span>
            <span class="state-val">${escHtml(msg.state || 'default')}</span>
            <span class="arrow">→</span>
            <span class="state-val ${stateChanged ? 'changed' : ''}">${escHtml(msg.stateNext || 'default')}</span>
        `
            card.appendChild(stateRow)

            // commands
            const cmds = (msg.commands || []).flat()
            if (cmds.length > 0) {
                const sec = document.createElement('div')
                sec.className = 'audit-section'
                sec.innerHTML = `<div class="audit-section-label">comandos reconhecidos</div>`

                const group = document.createElement('div')
                group.className = 'audit-cmd-group'

                for (const cmd of cmds) {
                    const params = Object.entries(cmd)
                        .filter(([k]) => k !== 'type')
                        .map(([k, v]) => `${k}: ${JSON.stringify(v)}`)
                        .join('  ')

                    const tag = document.createElement('span')
                    tag.className = 'audit-cmd-tag'
                    tag.innerHTML = `<strong>${escHtml(cmd.type)}</strong>${params ? `<span class="cmd-params"> ${escHtml(params)}</span>` : ''}`
                    group.appendChild(tag)
                }

                sec.appendChild(group)
                card.appendChild(sec)
            }

            // results
            const results = (msg.results || []).flat()
            if (results.length > 0) {
                const sec = document.createElement('div')
                sec.className = 'audit-section'
                sec.innerHTML = `<div class="audit-section-label">resultados</div>`

                const list = document.createElement('div')
                list.className = 'audit-result-list'

                for (const r of results) {
                    const hasInstruction = !!r.instruction
                    const hasInterrupt = !!r.interrupt

                    const item = document.createElement('div')
                    item.className = `audit-result-item${hasInstruction ? ' has-instruction' : ''}${hasInterrupt ? ' has-interrupt' : ''}`

                    const typeClass = hasInterrupt ? 'interrupt' : hasInstruction ? 'instruction' : ''
                    const rest = Object.entries(r)
                        .filter(([k]) => k !== 'type')
                        .map(([k, v]) => `<span style="color:#999">${escHtml(k)}:</span> ${escHtml(JSON.stringify(v))}`)
                        .join('  ')

                    item.innerHTML = `<span class="audit-result-type ${typeClass}">${escHtml(r.type)}</span>${rest}`
                    list.appendChild(item)
                }

                sec.appendChild(list)
                card.appendChild(sec)
            }

            auditContent.prepend(card)
        }

        // ── api ───────────────────────────────────────────────────────────
        async function post(content) {
            const res = await fetch('/api/trader-chat', {
                method: 'POST',
                headers: ctxHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ content })
            })
            if (!res.ok) throw new Error(`send error: ${res.status}`)
            return res.json()
        }

        async function receive() {
            const res = await fetch('/api/trader-chat', {
                headers: ctxHeaders()
            })
            if (!res.ok) throw new Error(`receive error: ${res.status}`)
            return res.json()
        }

        // ── send ──────────────────────────────────────────────────────────
        async function send() {
            const text = input.value.trim()
            if (!text) return

            input.value = ''
            input.style.height = 'auto'
            btn.disabled = true

            appendMessage(text, 'user')
            const typing = appendTyping()
            const t0 = performance.now()

            try {
                await post(text)
                const msg = await receive()
                const rtt = Math.round(performance.now() - t0)
                typing.remove()
                appendMessage(msg.content, 'agent', rtt)
                await refreshData()
                await refreshAudit()
            } catch (e) {
                typing.remove()
                appendMessage('erro ao obter resposta.', 'agent')
                console.error(e)
            } finally {
                btn.disabled = false
                input.focus()
            }
        }

        // ── conversas (auditoria: lista das 50 + reconstrução por inteiro) ──
        const conversasContent = document.getElementById('conversas-content')
        let conversasLoaded = false
        let convCache = []

        const cvNum = (v, d = 0) => v == null ? DASH : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: d })
        const cvDate = v => { const d = new Date(Number(v)); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) }
        const cvTime = v => { const d = new Date(Number(v)); return isNaN(d) ? '—' : d.toLocaleTimeString('pt-BR', { hour12: false }) }
        const cvFetch = url => fetch(url).then(r => { if (!r.ok) throw new Error(`${url} -> ${r.status}`); return r.json() })

        async function loadConversas() {
            if (conversasLoaded) return
            conversasLoaded = true
            conversasContent.innerHTML = '<div class="cv-loading">carregando conversas…</div>'
            try {
                convCache = await cvFetch('/api/trader-chat/metrics/conversations')
                renderConvList()
            } catch (e) {
                conversasLoaded = false
                conversasContent.innerHTML = '<div class="cv-error">falha ao carregar (Postgres no ar?)</div>'
                console.warn('loadConversas', e)
            }
        }

        function renderConvList() {
            const rows = convCache.map(c => {
                const who = c.owner_account || c.owner_user_profile_id || '—'
                const nf = Number(c.not_found) > 0 ? `<span class="cv-badge nf">${cvNum(c.not_found)} nf</span>` : ''
                const ord = Number(c.orders) > 0 ? `<span class="cv-badge ord">${cvNum(c.orders)} ord</span>` : ''
                return `<button class="cv-row" data-id="${escHtml(c.id)}">
                    <div class="cv-id">${escHtml(c.id.slice(0, 22))} <span class="cv-acct">· ${escHtml(who)} · v${escHtml(c.version || '?')}</span></div>
                    <div class="cv-badges"><span class="cv-badge">${cvNum(c.turns)}t</span>${nf}${ord}</div>
                    <div class="cv-last">${cvTime(c.created_at)} · ${escHtml(c.last_user_text || '(sem mensagem)')}</div>
                </button>`
            })
            conversasContent.innerHTML =
                `<div class="cv-hd"><h3>Conversas</h3><p>50 mais recentes · clique p/ auditar</p></div>
                 <input class="cv-search" id="cv-search" placeholder="filtrar por id, conta ou mensagem…" autocomplete="off"/>
                 <div class="cv-list" id="cv-list">${rows.join('')}</div>`
            const listEl = document.getElementById('cv-list')
            const search = document.getElementById('cv-search')
            listEl.addEventListener('click', e => { const b = e.target.closest('.cv-row'); if (b) openConversa(b.dataset.id) })
            search.addEventListener('input', () => {
                const q = search.value.trim().toLowerCase()
                for (const row of listEl.children) {
                    const c = convCache.find(x => x.id === row.dataset.id)
                    const hay = `${c.id} ${c.owner_account || ''} ${c.owner_user_profile_id || ''} ${c.last_user_text || ''}`.toLowerCase()
                    row.style.display = hay.includes(q) ? '' : 'none'
                }
            })
        }

        async function openConversa(id) {
            conversasContent.innerHTML = '<div class="cv-loading">reconstruindo conversa…</div>'
            try { renderConversa(await cvFetch('/api/trader-chat/metrics/conversation?id=' + encodeURIComponent(id))) }
            catch (e) { conversasContent.innerHTML = '<div class="cv-error">falha ao reconstruir</div>'; console.warn(e) }
        }

        function techChips(t) {
            const chips = t.commands.map(c => `<span class="tech cmd${c.result_status === 'not_found' ? ' miss' : ''}">${escHtml(c.command_method)} <span class="st">[${escHtml(c.agent)}] ${escHtml(c.result_status)}</span></span>`)
            t.llm_calls.forEach(l => chips.push(`<span class="tech llm">LLM ${escHtml(l.mode)}${l.parse_ok === false ? ' ✗' : ''}</span>`))
            return chips.length ? `<div class="turn-tech">${chips.join('')}</div>` : ''
        }

        function renderConversa(d) {
            if (!d.conversation) {
                conversasContent.innerHTML = '<button class="cv-back" onclick="renderConvList()">← voltar</button><div class="cv-error">conversa não encontrada</div>'
                return
            }
            const c = d.conversation
            const who = c.owner.account || c.owner.userProfileId || '—'
            const nf = d.turns.filter(t => t.is_not_found).length
            const meta = `<div class="cv-meta"><div class="cv-mid">${escHtml(c.id)}</div><div class="cv-facts">
                <div class="cv-fact"><b>${escHtml(who)}</b>conta (${escHtml(c.owner.mode)})</div>
                <div class="cv-fact"><b>v${escHtml(c.version || '?')}</b>versão</div>
                <div class="cv-fact"><b>${escHtml(c.status)}</b>status</div>
                <div class="cv-fact"><b>${d.turns.length}</b>turns</div>
                <div class="cv-fact"><b>${nf}</b>notFound</div>
                <div class="cv-fact"><b>${d.orders.length}</b>ordens</div>
                <div class="cv-fact"><b>${cvDate(c.createdAt)} ${cvTime(c.createdAt)}</b>início</div></div></div>`
            const turns = d.turns.map(t => {
                const cls = 'turn' + (t.is_not_found ? ' nf' : '') + (t.errored ? ' err' : '')
                let flags = ''
                if (t.is_not_found) flags += '<span class="flag nf">notFound</span>'
                if (t.errored) flags += '<span class="flag err">erro</span>'
                if (t.interrupt) flags += `<span class="flag int">interrupt${t.interrupt_type ? ' · ' + escHtml(t.interrupt_type) : ''}</span>`
                const u = t.user_text ? `<div class="cv-bubble user"><span class="who">usuário</span>${escHtml(t.user_text)}</div>` : ''
                const a = t.agent_text ? `<div class="cv-bubble agent"><span class="who">agente</span>${escHtml(t.agent_text)}</div>` : ''
                return `<div class="${cls}"><div class="turn-hd"><span class="seq">#${t.seq == null ? '?' : t.seq}</span> ${cvTime(t.created_at)} · ${cvNum(t.total_latency_ms)}ms ${flags}</div>${u}${a}${techChips(t)}</div>`
            }).join('')
            let orders = ''
            if (d.orders.length) {
                orders = `<div class="cv-orders"><h4>ordens desta conversa · ${d.orders.length}</h4>` + d.orders.map(o => {
                    const sent = o.event_type === 'ORDER_SENT'
                    return `<div class="ord-row"><span class="ord-type ${sent ? 'sent' : 'cancel'}">${sent ? 'enviada' : 'cancelada'}</span><span class="ord-sym">${escHtml(o.symbol || '?')}</span><span class="ord-det">${escHtml(o.side || '')} ${cvNum(o.quantity)}${o.price != null ? ' @ ' + cvNum(o.price, 2) : ''}${o.reason ? ' <span class="ord-reason">· ' + escHtml(o.reason) + '</span>' : ''}</span><span class="ord-when">${cvTime(o.created_at)}</span></div>`
                }).join('') + '</div>'
            }
            conversasContent.innerHTML = `<button class="cv-back" onclick="renderConvList()">← voltar às conversas</button>${meta}${turns}${orders}`
        }

        // ── métricas (KPIs por período: 1d/1w/1m/3m) ────────────────────────
        const metricsContent = document.getElementById('metrics-content')
        let metricsLoaded = false
        let metricsPeriod = '1m'
        const MXPAL = ['#1d4ed8', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2', '#db2777']

        function loadMetrics() { if (metricsLoaded) return; metricsLoaded = true; fetchMetrics() }
        function changePeriod(p) { metricsPeriod = p; fetchMetrics() }
        function fetchMetrics() {
            metricsContent.innerHTML = '<div class="cv-loading">carregando KPIs…</div>'
            cvFetch('/api/trader-chat/metrics?period=' + metricsPeriod)
                .then(renderMetrics)
                .catch(e => { metricsContent.innerHTML = '<div class="cv-error">falha ao carregar (Postgres no ar?)</div>'; console.warn('loadMetrics', e) })
        }

        const mxV = k => (k.rows && k.rows[0] ? k.rows[0].v : null)
        const mxUsd = raw => Number(raw).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 })
        function mxFmtTxt(k, raw) {
            if (raw == null) return DASH
            if (k.format === 'percent') return cvNum(raw, 1) + '%'
            if (k.format === 'brl') return Number(raw).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 })
            if (k.format === 'usd') return mxUsd(raw)
            if (k.format === 'ms') return cvNum(raw, 0) + ' ms'
            if (k.format === 'number2') return cvNum(raw, 2)
            return cvNum(raw, 0)
        }
        function mxFmtHtml(k, raw) {
            if (raw == null) return DASH
            if (k.format === 'percent') return cvNum(raw, 1) + '<span class="u">%</span>'
            if (k.format === 'brl') return Number(raw).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 })
            if (k.format === 'usd') return mxUsd(raw)
            if (k.format === 'ms') return cvNum(raw, 0) + '<span class="u">ms</span>'
            if (k.format === 'number2') return cvNum(raw, 2)
            return cvNum(raw, 0)
        }
        function execCard(k) {
            const arrow = k.good_direction === 'up' ? '▲' : k.good_direction === 'down' ? '▼' : ''
            const dc = k.good_direction === 'up' ? 'up' : 'down'
            return `<div class="mx-kpi"><div class="lbl">${escHtml(k.name)}${arrow ? ` <span class="mx-dir ${dc}">${arrow}</span>` : ''}</div><div class="val">${mxFmtHtml(k, mxV(k))}</div><div class="q">${escHtml(k.question || '')}</div></div>`
        }
        function miniCard(k) { return `<div class="mx-m"><div class="v">${mxFmtTxt(k, mxV(k))}</div><div class="l">${escHtml(k.name)}</div></div>` }
        function mxHead(k) { return `<h5>${escHtml(k.name)}</h5><p class="cq">${escHtml(k.question || '')}</p>` }
        function mxBar(k) {
            const rows = k.rows || []
            const max = Math.max(...rows.map(r => Number(r.n) || 0), 1)
            const bars = rows.map((r, i) => {
                const v = Number(r.n) || 0, w = (v / max * 100).toFixed(1)
                const sub = r.pct != null ? ` <span class="mx-bsub">· ${cvNum(r.pct, 1)}%</span>` : (r.agent ? ` <span class="mx-bsub">${escHtml(r.agent)}</span>` : '')
                return `<div class="mx-bar"><div class="mx-bl">${escHtml(r.label)}</div><div class="mx-bt"><div class="mx-bf" style="width:${w}%;background:${MXPAL[i % MXPAL.length]}"></div></div><div class="mx-bv">${cvNum(v)}${sub}</div></div>`
            }).join('')
            return `<div class="mx-card">${mxHead(k)}${bars}</div>`
        }
        function mxDonut(k) {
            const rows = k.rows || [], total = rows.reduce((s, r) => s + (Number(r.n) || 0), 0) || 1
            const R = 46, C = 2 * Math.PI * R; let acc = 0
            const segs = rows.map((r, i) => { const v = Number(r.n) || 0, dash = v / total * C; const s = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${MXPAL[i % MXPAL.length]}" stroke-width="14" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 60 60)"></circle>`; acc += dash; return s }).join('')
            const legend = rows.map((r, i) => `<div class="mx-lg"><span class="mx-sw" style="background:${MXPAL[i % MXPAL.length]}"></span>${escHtml(r.label)} <b>${cvNum(r.n)}</b>${r.pct != null ? ` (${cvNum(r.pct, 1)}%)` : ''}</div>`).join('')
            return `<div class="mx-card">${mxHead(k)}<div class="mx-donut-wrap"><svg viewBox="0 0 120 120" class="mx-donut">${segs}<text x="60" y="57" class="mx-donut-c">${cvNum(total)}</text><text x="60" y="72" class="mx-donut-cl">total</text></svg><div class="mx-legend">${legend}</div></div></div>`
        }
        function mxTable(k) {
            const rows = k.rows || []
            if (!rows.length) return `<div class="mx-card">${mxHead(k)}<div class="mx-empty">sem dados</div></div>`
            const cols = Object.keys(rows[0])
            const head = cols.map(c => `<th>${escHtml(c.replace(/_/g, ' '))}</th>`).join('')
            const body = rows.map(r => `<tr>${cols.map(c => { const num = r[c] !== null && r[c] !== '' && !isNaN(Number(r[c])); return `<td class="${num ? 'n' : ''}">${escHtml(r[c])}</td>` }).join('')}</tr>`).join('')
            return `<div class="mx-card wide">${mxHead(k)}<div style="overflow-x:auto"><table class="mx-tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`
        }
        function mxTimeseries(k) {
            const rows = k.rows || []
            if (!rows.length) return `<div class="mx-card">${mxHead(k)}<div class="mx-empty">sem dados no período</div></div>`
            const series = Object.keys(rows[0]).filter(c => c !== 'dia')
            const totals = {}; series.forEach(s => totals[s] = 0)
            const maxTotal = Math.max(...rows.map(r => series.reduce((sum, s) => sum + (Number(r[s]) || 0), 0)), 1)
            const bars = rows.map(r => {
                const segs = series.map((s, i) => { const v = Number(r[s]) || 0; totals[s] += v; const h = (v / maxTotal * 100).toFixed(1); return v > 0 ? `<div class="mx-ts-seg" style="height:${h}%;background:${MXPAL[i % MXPAL.length]}" title="${escHtml(s)}: ${cvNum(v)}"></div>` : '' }).join('')
                return `<div class="mx-ts-bar">${segs}</div>`
            }).join('')
            const xlabels = rows.length <= 16 ? `<div class="mx-ts-x">${rows.map(r => `<div class="mx-ts-xl">${escHtml(String(r.dia).slice(5))}</div>`).join('')}</div>` : ''
            const legend = series.map((s, i) => `<span><span class="mx-sw" style="display:inline-block;background:${MXPAL[i % MXPAL.length]}"></span> ${escHtml(s)} <b>${cvNum(totals[s])}</b></span>`).join('')
            return `<div class="mx-card wide">${mxHead(k)}<div class="mx-ts">${bars}</div>${xlabels}<div class="mx-ts-legend">${legend}</div></div>`
        }
        function renderMx(k) { switch (k.viz) { case 'bar': return mxBar(k); case 'donut': return mxDonut(k); case 'table': return mxTable(k); case 'timeseries': return mxTimeseries(k); default: return '' } }

        function renderMetrics(data) {
            const byId = {}; data.kpis.forEach(k => byId[k.id] = k)
            const periods = data.periods.map(p => `<button class="mx-period${p.id === data.period ? ' active' : ''}" onclick="changePeriod('${p.id}')">${escHtml(p.label)}</button>`).join('')
            let html = `<div class="mx-top"><div class="mx-periods">${periods}</div><span class="mx-note">tokens e latência ~0 no mock — medem de verdade com o LLM real</span></div>`
            html += `<div class="mx-exec">${data.headline.map(id => execCard(byId[id])).join('')}</div>`
            data.sections.filter(s => s.id !== 'exec').forEach(s => {
                const ks = data.kpis.filter(k => k.section === s.id && data.headline.indexOf(k.id) < 0)
                const bigs = ks.filter(k => k.viz === 'big_number'), rest = ks.filter(k => k.viz !== 'big_number')
                html += `<div class="mx-sec"><div class="mx-sec-h"><h4>${escHtml(s.title)}</h4><p>${escHtml(s.description)}</p></div>`
                if (bigs.length) html += `<div class="mx-mini">${bigs.map(miniCard).join('')}</div>`
                if (rest.length) html += `<div class="mx-cards">${rest.map(renderMx).join('')}</div>`
                html += `</div>`
            })
            metricsContent.innerHTML = html
        }

        // ── init ──────────────────────────────────────────────────────────
        async function loadHistory() {
            try {
                const msgs = await fetchJson('/api/trader-chat/history')
                if (msgs === NOT_FOUND || !msgs?.length) return   // esperado: contexto novo

                cmdHistory = msgs
                    .filter(m => m.role === 'user')
                    .map(m => m.content)
                    .reverse()

                for (const msg of msgs) {
                    if (msg.role === 'user' || msg.role === 'agent') {
                        appendMessage(msg.content, msg.role)
                    }
                }

                scrollBottom()
            } catch (e) { console.warn('loadHistory', e) }
        }

        refreshData()
        loadHistory()
        input.focus()

    </script>
</body>
